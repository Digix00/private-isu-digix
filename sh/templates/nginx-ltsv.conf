# alp で集計できる LTSV 形式のアクセスログ。nginx.conf の http { } の中に貼り付ける。
# 既存の access_log 行（http / server ブロック）はすべてこの形式にそろえる（server 側の指定が優先されるため）。
log_format ltsv "time:$time_iso8601\thost:$remote_addr\tmethod:$request_method\turi:$request_uri"
                "\tstatus:$status\tsize:$body_bytes_sent\treqtime:$request_time\tapptime:$upstream_response_time\tua:$http_user_agent";
# buffer= は付けない（make analyze の時点で末尾がまだ書かれていないことがある）
access_log /var/log/nginx/access.log ltsv;
# 最終ベンチ前に計測をやめる場合は "access_log off;" にして make deploy-nginx
