# alp で集計できる LTSV 形式のアクセスログ（http コンテキストに置く）。
# 配置例: /etc/nginx/conf.d/00-isucon-log.conf（Ubuntu の nginx.conf は conf.d/*.conf を http 内で include する）
# 配布: config/isucon.conf の ISU_NGINX_FILES に追加して scripts/deploy/nginx.sh を実行する。
#
# ラベルは alp の既定（time method uri status size reqtime apptime）に合わせている。
# reqid は 1 リクエストを他のログと突き合わせるため。ua は長くなるため最後に置く。
log_format isucon_ltsv "time:$time_iso8601\tmethod:$request_method\turi:$request_uri\tstatus:$status\tsize:$body_bytes_sent\treqtime:$request_time\tapptime:$upstream_response_time\thost:$remote_addr\treqid:$request_id\tua:$http_user_agent";

# buffer= や flush= は付けない。バッファがあると measure.sh stop の時点で末尾がまだ書かれておらず、
# 実行区間の切り出しで最後のリクエストが欠ける。ログ書き込みの負荷は ISUCON の規模では通常小さい。
# server ブロックに別の access_log がある場合は、そちらがこの指定を上書きする。
# その場合は server ブロック側を "access_log /var/log/nginx/access.log isucon_ltsv;" にそろえる。
access_log /var/log/nginx/access.log isucon_ltsv;

# 計測をやめるとき（最終ベンチ前など）は、この行を "access_log off;" にして再配布する。
